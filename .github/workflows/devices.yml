# When a device file is added or changed, rebuild devices/built/ (the .js copies and index the mapper loads)
# and the devices inside JoyVerse-offline.html.
name: Device index
on:
  push:
    branches: [main]
    paths: ['devices/*.json', 'tools/build_device_index.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/build_device_index.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add devices JoyVerse-offline.html
          git diff --cached --quiet || (git commit -m "Rebuild device index and share file" && git push)
