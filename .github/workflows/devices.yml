# When a device file is added or changed, rebuild devices/built/ (the .js copies and index the mapper loads)
# and the devices inside JoyVerse-offline.html.
name: Device index
on:
  push:
    branches: [main]
    paths: ['devices/*.json', 'tools/build_device_index.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python tools/build_device_index.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add devices JoyVerse-offline.html
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild device index and share file"
          # GitHub sometimes refuses a push for a moment, or another push got in first: try again a few times
          for i in 1 2 3 4; do git push && exit 0; sleep 15; git pull --rebase; done
          exit 1
